<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My account — Elpys</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="elpys-favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
  <style>
    .account-section { padding: 3rem 0 4rem; max-width: 480px; }
    .account-section h1 { font-size: clamp(1.375rem, 3vw, 1.75rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    .account-email { font-size: 0.9375rem; color: var(--muted); margin-bottom: 2.5rem; }
    .account-block { margin-bottom: 2.5rem; }
    .account-block-label { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
    .interests-fieldset { border: none; padding: 0; margin: 0; }
    .interest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.5rem; margin-bottom: 1rem; }
    .interest-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer; }
    .submit-btn { font-family: inherit; font-size: 0.9375rem; font-weight: 600; color: var(--white); background: var(--body); border: none; border-radius: var(--radius); padding: 0.65rem 1.5rem; cursor: pointer; }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .form-status { font-size: 0.875rem; padding: 0.75rem 1rem; border-radius: var(--radius); display: none; margin-bottom: 1rem; }
    .form-status.success { background: #ECFDF5; border: 1px solid #6EE7B7; color: #065F46; }
    .form-status.error   { background: #FEF2F2; border: 1px solid #FCA5A5; color: #991B1B; }
    .signout-btn { font-family: inherit; font-size: 0.875rem; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 0.5rem 1rem; cursor: pointer; }
    .signout-btn:hover { color: var(--body); border-color: #aaa; }
    .delete-btn { font-family: inherit; font-size: 0.875rem; color: #991B1B; background: none; border: 1px solid #FCA5A5; border-radius: var(--radius); padding: 0.5rem 1rem; cursor: pointer; margin-left: 0.75rem; }
    .delete-btn:hover { background: #FEF2F2; }
    .avail-grid { display: grid; grid-template-columns: 2.5rem 1fr 1fr 1fr; gap: 4px; margin-bottom: 1rem; }
    .avail-col-header { font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); text-align: center; padding-bottom: 0.25rem; }
    .avail-day-label { font-size: 0.75rem; font-weight: 600; color: var(--muted); display: flex; align-items: center; }
    .avail-cell { height: 32px; background: var(--off); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: background 0.1s, border-color 0.1s; }
    .avail-cell:hover { border-color: #aaa; background: #ebebeb; }
    .avail-cell.active { background: var(--body); border-color: var(--body); }
    #loading-msg { color: var(--muted); font-size: 0.9375rem; padding: 3rem 0; }
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="header-inner">
      <a href="index.html" class="site-name"><svg class="site-name-sparkles" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 115" aria-hidden="true"><g fill="#d9662f"><path d="M18 20.5 C18 27.2 18 27.2 24.7 30 C18 32.9 18 32.9 18 39.5 C18 32.9 18 32.9 11.4 30 C18 27.2 18 27.2 18 20.5 Z"/><path d="M182 16.5 C182 23.2 182 23.2 188.7 26 C182 28.9 182 28.9 182 35.5 C182 28.9 182 28.9 175.4 26 C182 23.2 182 23.2 182 16.5 Z"/></g><g fill="#e8935f"><path d="M9 67 C9 71.9 9 71.9 13.9 74 C9 76.1 9 76.1 9 81 C9 76.1 9 76.1 4.1 74 C9 71.9 9 71.9 9 67 Z"/><path d="M191 65 C191 69.9 191 69.9 195.9 72 C191 74.1 191 74.1 191 79 C191 74.1 191 74.1 186.1 72 C191 69.9 191 69.9 191 65 Z"/><path d="M62 98 C62 102.9 62 102.9 66.9 105 C62 107.1 62 107.1 62 112 C62 107.1 62 107.1 57.1 105 C62 102.9 62 102.9 62 98 Z"/><path d="M141 100 C141 104.9 141 104.9 145.9 107 C141 109.1 141 109.1 141 114 C141 109.1 141 109.1 136.1 107 C141 104.9 141 104.9 141 100 Z"/></g></svg>e<span class="site-name-l">l<svg class="site-name-flame" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 34" aria-hidden="true"><path d="M15 34 C9 30 7.5 23 10 17 C11.2 20.5 13.5 20.5 13.5 17 C15.5 20.5 19 23 16.5 28 C20 25.5 21 19.5 17.5 13.5 C22 17 23.5 24 20 30 C18 32.5 16 34 15 34 Z" fill="#d9662f"/><path d="M15 30 C12 28 11 24.5 12.4 21.5 C13 23.3 14.2 23.3 14.2 21.5 C15.2 23.3 17 24.5 15.6 27 C17.4 25.7 18 22.5 16.2 19.5 C18.5 21.3 19.2 25 17.4 28 C16.4 29.3 15.5 30 15 30 Z" fill="#f2a03d"/></svg><svg class="site-name-torch-base" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 12" aria-hidden="true"><path d="M3 0 L17 0 L14.5 6 L5.5 6 Z" fill="#2b2420"/><rect x="4.5" y="6" width="11" height="3.2" rx="1.6" fill="#2b2420"/></svg></span>pys</a>
      <a href="submit.html" class="header-submit-link">Submit an opportunity</a>
      <a href="account.html" id="header-auth-link" class="header-auth-link">My account</a>
    </div>
  </div>
</header>

<div class="wrap">
  <a href="index.html" class="back-link" style="display:block;margin-top:2rem;">← Back to opportunities</a>
  <p id="loading-msg">Loading…</p>
  <section class="account-section" id="account-section" style="display:none;"></section>
</div>

<footer>
  <div class="wrap">
    <div class="footer-inner">
      <p>All listings verified June 2026. Links and details may change — always confirm with the org before your first visit.</p>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  function showModal(opts) {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML =
      '<div class="modal-box">' +
        '<button class="modal-close" aria-label="Close">×</button>' +
        '<p class="modal-title">' + opts.title + '</p>' +
        '<p class="modal-body">' + opts.body + '</p>' +
        '<div class="modal-actions">' +
          '<button class="modal-btn-cancel">Cancel</button>' +
          '<button class="modal-btn-action' + (opts.danger ? ' danger' : '') + '">' + opts.confirmText + '</button>' +
        '</div>' +
      '</div>';
    function close() { overlay.remove(); }
    overlay.querySelector('.modal-close').addEventListener('click', close);
    overlay.querySelector('.modal-btn-cancel').addEventListener('click', close);
    overlay.querySelector('.modal-btn-action').addEventListener('click', function () { close(); opts.onConfirm(); });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    document.body.appendChild(overlay);
  }

  var _supa = supabase.createClient(
    'https://ukrykzmehvghedrvmkjj.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrcnlrem1laHZnaGVkcnZta2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzODc4NzgsImV4cCI6MjA5ODk2Mzg3OH0.J1J4p3lTbQKMc3GvWVlBxAZZV1jGYPIU4Jj_ePLndgM'
  );

  var CATEGORIES = ['Animals', 'Community', 'Environment', 'Food'];

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function init() {
    // getSession handles the auth callback URL after email verification automatically
    var sessionResult = await _supa.auth.getSession();
    var session = sessionResult.data && sessionResult.data.session;

    if (!session) {
      location.replace('login.html');
      return;
    }

    var user = session.user;
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('account-section').style.display = 'block';

    // Load profile row (created automatically by Supabase trigger on signup)
    var profileResult = await _supa.from('profiles').select('interests,unsubscribed,availability').eq('id', user.id).single();
    var profile = profileResult.data;

    var currentInterests  = (profile && Array.isArray(profile.interests)) ? profile.interests : [];
    var isUnsubscribed      = profile ? !!profile.unsubscribed : false;
    var currentAvailability = (profile && profile.availability && typeof profile.availability === 'object')
      ? profile.availability : {};

    // Post-signup: interests saved in user metadata but not yet in profile — migrate them
    var metaInterests = (user.user_metadata && Array.isArray(user.user_metadata.interests))
      ? user.user_metadata.interests : [];
    if (currentInterests.length === 0 && metaInterests.length > 0) {
      await _supa.from('profiles').update({ interests: metaInterests }).eq('id', user.id);
      currentInterests = metaInterests;
    }

    render(user, currentInterests, isUnsubscribed, currentAvailability);
  }

  var DAYS        = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
  var DAY_ABBR    = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var SLOTS       = ['morning','afternoon','evening'];
  var SLOT_LABELS = ['Morning','Afternoon','Evening'];

  function buildAvailGrid(avail) {
    var header = '<div class="avail-col-header"></div>' +
      SLOT_LABELS.map(function(l) { return '<div class="avail-col-header">' + l + '</div>'; }).join('');
    var rows = DAYS.map(function(day, di) {
      var daySlots = (avail && Array.isArray(avail[day])) ? avail[day] : [];
      return '<div class="avail-day-label">' + DAY_ABBR[di] + '</div>' +
        SLOTS.map(function(slot) {
          var cls = daySlots.indexOf(slot) !== -1 ? ' active' : '';
          return '<button class="avail-cell' + cls + '" data-day="' + day + '" data-slot="' + slot + '"></button>';
        }).join('');
    }).join('');
    return '<div class="avail-grid">' + header + rows + '</div>';
  }

  function render(user, currentInterests, isUnsubscribed, currentAvailability) {
    var section = document.getElementById('account-section');

    var notifLabel = isUnsubscribed ? 'Enable email notifications' : 'Disable email notifications';
    var notifHint  = isUnsubscribed
      ? 'You\'re not receiving the weekly digest. Turn it back on to get new opportunities by email.'
      : 'You\'ll receive a weekly email when new opportunities match your interests.';

    section.innerHTML =
      '<h1>My account</h1>' +
      '<p class="account-email">' + esc(user.email) + '</p>' +

      '<div class="account-block">' +
        '<p class="account-block-label">My interests</p>' +
        '<p style="font-size:0.875rem;color:#555;margin-bottom:0.75rem;">We\'ll highlight opportunities that match when you\'re browsing.</p>' +
        '<div class="form-status" id="save-status"></div>' +
        '<form id="interests-form" class="interests-fieldset">' +
          '<div class="interest-grid">' +
            CATEGORIES.map(function (cat) {
              var checked = currentInterests.indexOf(cat) !== -1 ? ' checked' : '';
              return '<label class="interest-label"><input type="checkbox" name="interest" value="' + cat + '"' + checked + '> ' + cat + '</label>';
            }).join('') +
          '</div>' +
          '<button type="submit" class="submit-btn" id="save-btn">Save interests →</button>' +
        '</form>' +
      '</div>' +

      '<div class="account-block">' +
        '<p class="account-block-label">My availability</p>' +
        '<p style="font-size:0.875rem;color:#555;margin-bottom:0.75rem;">Select when you\'re generally available. We\'ll only include opportunities that fit your schedule in the weekly digest.</p>' +
        '<div class="form-status" id="avail-status"></div>' +
        buildAvailGrid(currentAvailability) +
        '<button class="submit-btn" id="avail-save-btn">Save availability →</button>' +
      '</div>' +

      '<div class="account-block">' +
        '<p class="account-block-label">Email notifications</p>' +
        '<p id="notif-hint" style="font-size:0.875rem;color:#555;margin-bottom:0.75rem;">' + notifHint + '</p>' +
        '<div class="form-status" id="notif-status"></div>' +
        '<button class="signout-btn" id="notif-btn">' + notifLabel + '</button>' +
      '</div>' +

      '<div class="account-block">' +
        '<p class="account-block-label">Account</p>' +
        '<button class="signout-btn" id="signout-btn">Log out</button>' +
        '<button class="delete-btn" id="delete-btn">Delete account</button>' +
      '</div>';

    document.getElementById('interests-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var selected = Array.from(e.currentTarget.querySelectorAll('input[name="interest"]:checked')).map(function (c) { return c.value; });
      var saveBtn    = document.getElementById('save-btn');
      var saveStatus = document.getElementById('save-status');

      saveBtn.disabled    = true;
      saveBtn.textContent = 'Saving…';
      saveStatus.style.display = 'none';

      var result = await _supa.from('profiles').update({ interests: selected }).eq('id', user.id);

      saveStatus.className     = 'form-status ' + (result.error ? 'error' : 'success');
      saveStatus.textContent   = result.error ? 'Could not save: ' + result.error.message : 'Saved!';
      saveStatus.style.display = 'block';
      saveBtn.disabled         = false;
      saveBtn.textContent      = 'Save interests →';
    });

    var _unsubscribed = isUnsubscribed;
    document.getElementById('notif-btn').addEventListener('click', async function () {
      var btn         = document.getElementById('notif-btn');
      var notifStatus = document.getElementById('notif-status');
      var newVal      = !_unsubscribed;

      btn.disabled    = true;
      btn.textContent = 'Saving…';
      notifStatus.style.display = 'none';

      var result = await _supa.from('profiles').update({ unsubscribed: newVal }).eq('id', user.id);

      if (result.error) {
        notifStatus.className     = 'form-status error';
        notifStatus.textContent   = 'Could not save: ' + result.error.message;
        notifStatus.style.display = 'block';
        btn.disabled    = false;
        btn.textContent = _unsubscribed ? 'Enable email notifications' : 'Disable email notifications';
      } else {
        _unsubscribed       = newVal;
        btn.textContent     = _unsubscribed ? 'Enable email notifications' : 'Disable email notifications';
        btn.disabled        = false;
        notifStatus.className     = 'form-status success';
        notifStatus.textContent   = _unsubscribed ? 'Notifications disabled.' : 'Notifications enabled!';
        notifStatus.style.display = 'block';
        document.getElementById('notif-hint').textContent =
          _unsubscribed
            ? 'You\'re not receiving the weekly digest. Turn it back on to get new opportunities by email.'
            : 'You\'ll receive a weekly email when new opportunities match your interests.';
      }
    });

    document.getElementById('signout-btn').addEventListener('click', function () {
      showModal({
        title:       'Log out?',
        body:        'You\'ll be signed out of your account.',
        confirmText: 'Log out',
        onConfirm:   async function () {
          await _supa.auth.signOut();
          location.replace('index.html');
        },
      });
    });

    document.getElementById('delete-btn').addEventListener('click', function () {
      showModal({
        title:       'Delete account?',
        body:        'This will permanently delete your account and all your saved data. This cannot be undone.',
        confirmText: 'Delete account',
        danger:      true,
        onConfirm:   async function () {
          var sessionResult = await _supa.auth.getSession();
          var token = sessionResult.data && sessionResult.data.session && sessionResult.data.session.access_token;
          if (!token) { alert('Could not get session. Please refresh and try again.'); return; }

          var res = await fetch('/api/delete-account', {
            method:  'DELETE',
            headers: { 'Authorization': 'Bearer ' + token },
          });

          if (res.ok) {
            await _supa.auth.signOut();
            location.replace('index.html');
          } else {
            alert('Could not delete account. Please try again.');
          }
        },
      });
    });

    document.querySelectorAll('.avail-cell').forEach(function(cell) {
      cell.addEventListener('click', function() { this.classList.toggle('active'); });
    });

    document.getElementById('avail-save-btn').addEventListener('click', async function() {
      var btn    = document.getElementById('avail-save-btn');
      var status = document.getElementById('avail-status');
      var avail  = {};
      DAYS.forEach(function(day) { avail[day] = []; });
      document.querySelectorAll('.avail-cell.active').forEach(function(cell) {
        avail[cell.dataset.day].push(cell.dataset.slot);
      });

      btn.disabled    = true;
      btn.textContent = 'Saving…';
      status.style.display = 'none';

      var result = await _supa.from('profiles').update({ availability: avail }).eq('id', user.id);

      status.className     = 'form-status ' + (result.error ? 'error' : 'success');
      status.textContent   = result.error ? 'Could not save: ' + result.error.message : 'Saved!';
      status.style.display = 'block';
      btn.disabled         = false;
      btn.textContent      = 'Save availability →';
    });
  }

  init();
</script>
<script src="supabase-auth.js"></script>
<script src="beta-banner.js"></script>

</body>
</html>
